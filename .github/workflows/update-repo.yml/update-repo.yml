name: Update SideStore Repo

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest freepiv release and build source.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -sSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/normalllll/freepiv/releases/latest -o release.json
          TAG=$(jq -r '.tag_name' release.json)
          VERSION=$(echo "$TAG" | sed 's/^v//; s/+.*//')
          DATE=$(jq -r '.published_at' release.json)
          CHANGELOG=$(jq -r '.body // ""' release.json)
          IPA_URL=$(jq -r '.assets[] | select(.name | endswith(".ipa")) | .browser_download_url' release.json | head -n 1)
          IPA_SIZE=$(jq -r '.assets[] | select(.name | endswith(".ipa")) | .size' release.json | head -n 1)
          if [ -z "$IPA_URL" ] || [ "$IPA_URL" = "null" ]; then echo "No .ipa asset found in latest release"; exit 1; fi
          SOURCE_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/source.json"
          jq -n \
            --arg sourceURL "$SOURCE_URL" \
            --arg version "$VERSION" \
            --arg versionDate "$DATE" \
            --arg versionDescription "$CHANGELOG" \
            --arg downloadURL "$IPA_URL" \
            --argjson size "$IPA_SIZE" \
            '{
              name: "freepiv",
              identifier: "com.gilgamesh.freepiv-source",
              sourceURL: $sourceURL,
              apps: [
                {
                  name: "freepiv",
                  bundleIdentifier: "io.github.normalllll.freepiv",
                  developerName: "normalllll",
                  subtitle: "Unofficial Pixiv client",
                  localizedDescription: "freepiv is an unofficial Pixiv client.",
                  iconURL: "https://raw.githubusercontent.com/normalllll/freepiv/main/icon-512.png",
                  tintColor: "7C3AED",
                  version: $version,
                  versionDate: $versionDate,
                  versionDescription: $versionDescription,
                  downloadURL: $downloadURL,
                  size: $size,
                  beta: false
                }
              ],
              news: []
            }' > source.json
          cat source.json
          python3 -m json.tool source.json > /dev/null
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source.json
          git diff --cached --quiet || git commit -m "Update freepiv to $(jq -r '.apps[0].version' source.json)"
          git push
